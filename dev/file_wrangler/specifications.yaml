spec_name: "multilingual-test"
file_path_str: ""
# file_extension: ".csv"
new_cols:
  - ["Language of resource", "French"]
  - ["ISBN", ""]
  - ["Barcode", "300000000"]
  - ["Year of copyright", ""]
  - ["Country of publication", "France"]
  - ["Note", ""]
split_cols:
  # Using single quotes keeps this a literal raw string
  # named capture groups: (?P<name>...)
  # - ["Publisher", '(?P<pn1>[^,]+),\s*(?P<pn2>.+?)$']
  - ["Publisher", '(?P<pn1>[^,]+),\s*(?P<pn2>.*?)(?:\.\s|$)']
  - ["Size (cm)", '^(?P<Size>[\d]+)']
drop_cols:
  - Complete?
  - Author of Text
  - Size (cm)
ideal_order:
  - Language of resource
  - ISBN
  - Title
  - Subtitle
  - Artist
  - pn1 ===> (State,) City of publication
  - Country of publication
  - pn2 ===> Publisher's name
  - Publication date ===> Year of publication
  - Year of copyright
  - Pagination
  - Size
  - Note
  - Author ===> Author(s)
  - Primary Call No Desc ===> Call number
  - Supplementary info ===> Holding note
  - Barcode